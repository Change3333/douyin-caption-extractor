name: 功能建议
description: 提议新功能或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述使用场景，而不只是解决方案。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues
          required: true
